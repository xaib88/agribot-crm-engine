name: 24/7 Render Anti-Sleep Keep-Alive Cron

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WhatsApp Gateway and AgriBot Engine
        run: |
          echo "Pinging Cloud WhatsApp API Gateway..."
          curl -s -o /dev/null -w "%{http_code}\n" -H "X-Api-Key: agri_secret_123" "https://waha-whatsapp-server.onrender.com/api/sessions?all=true" || true
          curl -s -o /dev/null -w "%{http_code}\n" "https://waha-whatsapp-server.onrender.com/" || true
          echo "Pinging Cloud AgriBot Engine..."
          curl -s -o /dev/null -w "%{http_code}\n" "https://agribot-crm-engine.onrender.com/health" || true
